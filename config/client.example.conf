# Example mywgclient / WireGuard client configuration (wg-quick style).
# Replace keys with output from: go run ./cmd/keygen
#
# Import this file in the GUI, or:
#   sudo ./mywgclient -config config/client.example.conf

[Interface]
PrivateKey = CLIENT_PRIVATE_KEY_BASE64_HERE
Address = 10.8.0.2/24
# DNS = 1.1.1.1
MTU = 1420

[Peer]
PublicKey = SERVER_PUBLIC_KEY_BASE64_HERE
Endpoint = vpn.example.com:51820
AllowedIPs = 10.8.0.0/24
PersistentKeepalive = 25
# PresharedKey = OPTIONAL_PSK_BASE64_HERE
