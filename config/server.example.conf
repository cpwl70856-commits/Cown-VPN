# Minimal userspace WireGuard peer for testing with cmd/server.
# Generate keys: go run ./cmd/keygen
#
#   sudo ./mywgserver -config config/server.example.conf

[Interface]
PrivateKey = SERVER_PRIVATE_KEY_BASE64_HERE
Address = 10.8.0.1/24
ListenPort = 51820
MTU = 1420

[Peer]
PublicKey = CLIENT_PUBLIC_KEY_BASE64_HERE
AllowedIPs = 10.8.0.2/32
